name: Plugins

# Packs every plugin, attaches the zips to a GitHub release, and publishes them
# to the marketplace.
#
# A separate tag namespace from `v*` on purpose. `v*` is the version of
# @orknux/plugin, the library — it moves when the library does. The plugins
# have their own versions, in their own `plugin.json` files, and they change far
# more often than the library does. Tagging the library to ship a fix to the
# slack plugin would say something untrue.
#
#     git tag plugins-v2026.09.19 && git push origin plugins-v2026.09.19
#
# The tag name is only a label for the release; what a zip is called comes from
# the plugin's own key and version. `workflow_dispatch` runs the same thing by
# hand from the Actions tab, and makes no release and publishes nothing — it is
# for checking that the pack still works.
#
# The zips are not in the repository, deliberately: they hold only files that
# are already committed, in a form git cannot delta, and every rebuild would
# rewrite each of them whole. A release is where a built artifact belongs.
on:
  push:
    tags: ['plugins-v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Pack, release and publish
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes to the repository. Nothing else here does,
      # and the default token is otherwise read-only.
      contents: write

    steps:
      # The whole history, not the tip.
      #
      # A release's notes are the commit that set that plugin's version, found
      # with `git log -S` over its `plugin.json` - which needs the commits to
      # be here. A hundred of them in 34 MB is cheaper than asking anybody to
      # write the same sentence twice.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # What the compose service runs, so a green run here means the same
          # thing it means on a development machine.
          node-version: '22'
          cache: npm

      # `prepare` builds the library on the way through, which is what
      # `pack.mjs` imports `inspect` from.
      - name: Install
        run: npm ci

      # Nothing ships that has not been through the suite.
      - name: Test
        run: npm test

      # A zip is built from the checked-in artifact, not from `src/`, so an
      # artifact that no longer matches the source it came from would ship
      # silently. Rebuilding and looking for a diff catches that: the bundler is
      # pinned by package-lock, so the same source gives the same bytes, and any
      # difference means somebody edited a source without rebuilding.
      - name: Check the icons are up to date
        run: |
          npm run build:icons --workspace @orknux/plugins
          if ! git diff --quiet -- plugins/; then
            echo '::error::An icon does not match what icons.mjs draws'
            echo 'Redraw and commit:' >&2
            echo '  npm run build:icons --workspace @orknux/plugins' >&2
            git diff --stat -- plugins/ >&2
            exit 1
          fi

      - name: Pack
        run: npm run pack --workspace @orknux/plugins

      # Every zip is opened and the plugin inside is asked what it is, by the
      # same CLI an author runs before uploading. A zip holding something the
      # server would refuse fails here rather than on somebody's installation —
      # which is the point of doing it before the release exists.
      - name: Check what is in the zips
        run: |
          set -euo pipefail
          for zip in plugins/dist/*.zip; do
            where="$(mktemp -d)"
            unzip -qq "$zip" -d "$where"
            file="$(node -p "const m = require('$where/plugin.json'); m.path || m.key + '.js'")"
            # The whole report only on a refusal: it runs to a hundred lines a
            # plugin, and twelve of those would bury the one that failed.
            if ! npx orknux-plugin check "$where/$file" > check.log 2>&1; then
              echo "::error::$(basename "$zip") holds something the server would refuse"
              cat check.log
              exit 1
            fi
            echo "$(basename "$zip") — $(sed -n '2p' check.log | tr -s ' ')"
          done

      # The tag is a label; the table is what somebody reading the release
      # actually needs — which plugin, which version, and how big.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        run: |
          set -euo pipefail
          {
            echo 'Each zip holds one plugin: the plugin itself, its `plugin.json`, the'
            echo '`README.md` that manifest names, its icon, and any libraries it declares.'
            echo 'Upload one to a marketplace — or load a single-file plugin straight from its'
            echo 'raw URL in this repository without downloading anything at all.'
            echo
            echo '| Plugin | Version | Zip |'
            echo '|---|---|---|'
            for zip in plugins/dist/*.zip; do
              name="$(basename "$zip" .zip)"
              echo "| \`${name%-*}\` | ${name##*-} | $(du -h "$zip" | cut -f1) |"
            done
            echo
            echo 'Packing is deterministic — every entry carries a fixed timestamp — so'
            echo 'repacking this tag gives byte-identical zips.'
          } > release-notes.md
          cat release-notes.md

      # The title says what moved, because the tag already says when.
      #
      # Worked out by comparing this run's zips against the previous release's,
      # which is the only place the last published versions are written down: a
      # shallow checkout has no history to diff, and the marketplace is not this
      # build's to interrogate. A zip is named `<key>-<version>.zip`, so the
      # comparison is the file list and nothing else.
      #
      # A release that moves no version still happens and says so. The manifest
      # schema keeps republishing an unchanged version as the way to fix a
      # description without shoving the listing back to the top of "newest
      # first", and a title reading "descriptions only" is that being honest
      # rather than a release pretending to carry something.
      - name: Name the release
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          now="$(cd plugins/dist && ls *.zip | sed 's/\.zip$//' | sort)"

          # This tag's own release is not the previous one, and on a re-run it
          # is there to be mistaken for it — which reads every version as
          # already published and titles the release "descriptions only".
          previous="$(gh release list --limit 50 --json tagName \
            --jq '[.[] | select(.tagName | startswith("plugins-v"))
                       | select(.tagName != env.GITHUB_REF_NAME)][0].tagName' || true)"

          if [ -z "$previous" ]; then
            count="$(printf '%s\n' "$now" | wc -l | tr -d ' ')"
            title="Plugins — first release, $count plugins"
          else
            was="$(gh release view "$previous" --json assets \
              --jq '.assets[].name' | sed 's/\.zip$//' | sort)"

            # In this list and not in that one: a key at a version nobody has
            # published before, which is what "moved" means here.
            moved="$(comm -23 <(printf '%s\n' "$now") <(printf '%s\n' "$was") \
              | sed 's/-\([^-]*\)$/ \1/' | paste -sd',' - | sed 's/,/, /g')"

            if [ -z "$moved" ]; then
              title="Plugins — descriptions only, no version moved"
            else
              total="$(printf '%s\n' "$moved" | tr ',' '\n' | wc -l | tr -d ' ')"
              if [ "$total" -gt 4 ]; then
                # Four is about what gets read before a title becomes a list.
                shown="$(printf '%s' "$moved" | cut -d, -f1-4)"
                title="Plugins — $shown and $((total - 4)) more"
              else
                title="Plugins — $moved"
              fi
            fi
          fi

          echo "$title"
          echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"

      # Created, or filled in where a previous attempt left one behind.
      #
      # `gh release create` refuses a tag that already has a release, which
      # made the promise in the step below untrue the first time it was needed:
      # the marketplace answered 520 halfway down the loop, and the re-run that
      # was supposed to finish the job died here instead, before reaching the
      # step it was re-run for. Packing is deterministic, so a zip uploaded
      # over itself is the same bytes and updating is the same release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released, so this run updates it"
            gh release edit "$GITHUB_REF_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" plugins/dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              plugins/dist/*.zip
          fi

      # Last, and deliberately after the release exists.
      #
      # `POST /api/plugins` upserts, so re-running a tag is safe and the loop
      # never has to ask whether a key is already there: 201 says it created
      # one, 200 says it replaced one, and neither is a decision this build
      # makes. That is also what makes the ordering cheap — if publishing
      # fails, the tag and the release still stand and a re-run finishes the
      # job. The other way round would leave a plugin published against a
      # release nobody can read.
      #
      # The token is a publish token, scoped to exactly this. An install token
      # lives in an orknux-server somebody else may administer, and one token
      # doing both would mean every server holding a copy could publish.
      - name: Publish to the marketplace
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        env:
          ORKNUX_PUBLISH_TOKEN: ${{ secrets.ORKNUX_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORKNUX_PUBLISH_TOKEN:-}" ]; then
            echo '::error::ORKNUX_PUBLISH_TOKEN is not set, so there is nothing to publish with'
            exit 1
          fi

          published=0
          noted=0
          refused=
          for zip in plugins/dist/*.zip; do
            name="$(basename "$zip")"
            slug="${name%.zip}"
            key="${slug%-*}"
            version="${slug##*-}"

            # What changed, for the listing to show beside this version.
            #
            # The commit that set the version is the note, because it already
            # is one: a bump and the reason for it are written in the same
            # place here, and asking for the same sentence again in a file
            # beside the plugin is asking for one of the two to go stale.
            # `-S` finds where this exact version string entered the manifest.
            #
            # Sent every time, for every plugin, not only for the ones whose
            # version moved. The notes are derived from the version rather
            # than from the run, so a plugin republished unchanged is sent the
            # same words it already had - which makes this idempotent, and
            # means a listing that has no notes yet gets them on the next
            # release rather than staying blank until its next bump.
            rm -f notes.md
            sha="$(git log -1 --format=%H -S"\"version\": \"$version\"" \
              -- "plugins/$key/plugin.json" || true)"
            if [ -n "$sha" ]; then
              git log -1 --format='%s%n%n%b' "$sha" > notes.md

              # The schema takes 4000 characters and a commit body has no such
              # ceiling. Cut on a paragraph rather than mid-sentence, and say
              # so in the notes themselves - prose that stops without warning
              # reads as a mistake, which it would then be.
              if [ "$(wc -c < notes.md)" -gt 4000 ]; then
                awk 'BEGIN { RS = ""; ORS = "\n\n" }
                     { if (length(kept) + length($0) + 2 > 3880) exit; kept = kept $0; print }
                     END { }' notes.md > trimmed.md
                printf '*(Shortened. The whole commit is in the repository.)*\n' >> trimmed.md
                mv trimmed.md notes.md
                echo "::notice::$key $version has a long commit, so its notes were shortened"
              fi

              noted=$((noted + 1))
            else
              # A version that entered the manifest before this repository did,
              # or one hand-edited into it. Worth saying out loud, and not
              # worth failing a release over.
              echo "::warning::no commit set $key $version, so it goes up without notes"
            fi

            # `-o` keeps the body out of the log, where a token echoed back in
            # an error would otherwise land; `-w` is the only thing printed.
            sending=(
              # `--retry-all-errors` is the half that was missing: without it
              # curl retries a refused connection and not an HTTP status, and
              # what this endpoint actually does under load is answer 520.
              -sS --retry 3 --retry-delay 5 --retry-all-errors --retry-connrefused
              -o answer.json -w '%{http_code}'
              -X POST https://orknux.ai/api/plugins
              -H "Authorization: Bearer $ORKNUX_PUBLISH_TOKEN"
              -F "file=@$zip"
            )
            # `notes=<file` sends the file's text as a field. `@` would send it
            # as an upload, which is not what a paragraph is.
            if [ -f notes.md ]; then
              sending+=(-F 'notes=<notes.md')
            fi

            status="$(curl "${sending[@]}")"

            case "$status" in
              201) echo "$name — created" ;;
              200) echo "$name — replaced" ;;
              *)
                # Noted and carried on with, rather than exited on.
                #
                # This loop used to stop at the first refusal, which made one
                # flaky upload of an *unchanged* plugin a wall in front of
                # every plugin alphabetically after it: a plugin went
                # unpublished three times running because an earlier one — the
                # same bytes already on the marketplace — answered 520. The run
                # still fails, and now it fails knowing which of them landed.
                echo "::error::$name — the marketplace answered $status"
                # The body, for the sentence it carries. It is the API's own
                # error, not the request, so there is no credential in it.
                cat answer.json || true
                refused="$refused $name"
                continue
                ;;
            esac
            published=$((published + 1))
          done
          echo "published $published plugin(s) to orknux.ai, $noted of them with notes"

          if [ -n "$refused" ]; then
            echo "::error::the marketplace refused:$refused"
            exit 1
          fi

      # On a manual run there is no tag and no release, so the zips go up as a
      # build artifact instead — which is what somebody clicking "Run workflow"
      # to check the pack still works actually wants to see. Nothing is
      # published either: a dispatch is for checking the pack, not for
      # shipping.
      - name: Keep the zips for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/plugins-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: plugins/dist/*.zip
          retention-days: 14
